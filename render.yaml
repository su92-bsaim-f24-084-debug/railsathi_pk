services:
  - type: web
    name: railsathi-pk
    runtime: python
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn --workers 3 --threads 2 --timeout 120 \"run:app\""
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: FLASK_APP
        value: run.py
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: railsathi-db
          property: connectionString

databases:
  - name: railsathi-db
    databaseName: railsathi_pk
    plan: free

