{% extends "base.html" %}

{% block title %}400 Bad Request — RailSathi PK{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-5">
                <div class="display-1 fw-bold text-warning mb-3">400</div>
                <h3 class="fw-bold mb-3">Invalid or Bad Request</h3>
                <p class="text-muted mb-4">
                    The request parameters, stop sequences, or form payload could not be verified by the railway application server.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-pr-green text-white px-4 rounded-pill">
                        <i class="bi bi-house me-1"></i>Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
