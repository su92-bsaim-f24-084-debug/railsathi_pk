{% extends "base.html" %}

{% block title %}403 Forbidden — RailSathi PK{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 p-5">
                <div class="display-1 fw-bold text-danger mb-3">403</div>
                <h3 class="fw-bold mb-3">Access Restricted</h3>
                <p class="text-muted mb-4">
                    You do not have the required role permissions to access this administrative or operational railway terminal.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('main.index') }}" class="btn btn-pr-green text-white px-4 rounded-pill">
                        <i class="bi bi-house me-1"></i>Return Home
                    </a>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary px-4 rounded-pill">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Switch User
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
